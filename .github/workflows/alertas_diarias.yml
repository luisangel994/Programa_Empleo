name: Monitor Diario de Convocatorias Valencia

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 07:00 UTC (08:00 o 09:00 hora de España)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions de GitHub

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Monitor de Convocatorias
        env:
          EMAIL_REMITENTE: ${{ secrets.EMAIL_REMITENTE }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python scraper.py

      - name: Guardar Histórico Actualizado en Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add vistas.json
          git commit -m "chore: actualizar histórico de convocatorias [skip ci]" || exit 0
          git push
